<svg xmlns="http://www.w3.org/2000/svg" width="750" height="720" viewBox="0 0 750 720" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>
  <rect width="750" height="720" fill="#ffffff"/>
  <!-- 起点 -->
  <rect x="275" y="20" width="200" height="40" rx="20" fill="#2c3e50"/>
  <text x="375" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">bootloader 读取 Boot Package</text>
  <!-- Step 1 -->
  <rect x="200" y="85" width="350" height="55" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="375" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Step 1 · CRC 快速校验</text>
  <text x="375" y="128" text-anchor="middle" font-size="11" fill="#7f8c8d">CRC32(BPT[0x000–0xFEB]) = crc32 ?</text>
  <!-- Step 2 -->
  <rect x="200" y="170" width="350" height="55" rx="6" fill="#fdebd0" stroke="#f39c12" stroke-width="1.5"/>
  <text x="375" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Step 2 · 镜像完整性</text>
  <text x="375" y="213" text-anchor="middle" font-size="11" fill="#7f8c8d">SHA256(镜像, img_sz) = iib.hash ?</text>
  <!-- 生命周期检查 -->
  <rect x="200" y="255" width="350" height="50" rx="6" fill="#f4f6f7" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="375" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f8c8d">生命周期检查（非信任校验）</text>
  <text x="375" y="296" text-anchor="middle" font-size="11" fill="#95a5a6">eFuse.PROD.bit7 = 1 ?</text>
  <!-- Step 3 -->
  <rect x="200" y="335" width="350" height="55" rx="6" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="375" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Step 3 · 可信根绑定</text>
  <text x="375" y="378" text-anchor="middle" font-size="11" fill="#7f8c8d">SHA256(RCP 区) = eFuse.ROTPK1 ?</text>
  <!-- Step 4 -->
  <rect x="200" y="420" width="350" height="55" rx="6" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="375" y="443" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Step 4 · RSA 签名运算</text>
  <text x="375" y="463" text-anchor="middle" font-size="11" fill="#7f8c8d">EM = RSA2048_public(sig, pubk.e, pubk.n)</text>
  <!-- Step 5 -->
  <rect x="200" y="505" width="350" height="55" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="375" y="528" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Step 5 · 签名覆盖范围</text>
  <text x="375" y="548" text-anchor="middle" font-size="11" fill="#7f8c8d">EMSA_decode(EM) = SHA256(BPT[0x000–0x813]) ?</text>
  <!-- 成功 -->
  <rect x="275" y="600" width="200" height="45" rx="22" fill="#27ae60"/>
  <text x="375" y="628" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">全部通过 → 跳转 APP</text>
  <!-- 主流程连线 -->
  <line x1="375" y1="60" x2="375" y2="85" stroke="#34495e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="375" y1="140" x2="375" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="375" y1="225" x2="375" y2="255" stroke="#34495e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="375" y1="305" x2="375" y2="335" stroke="#34495e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="375" y1="390" x2="375" y2="420" stroke="#34495e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="375" y1="475" x2="375" y2="505" stroke="#34495e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="375" y1="560" x2="375" y2="600" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- 失败总线：顶部从 Step1 失败线起步，不悬空 -->
  <line x1="580" y1="112" x2="580" y2="565" stroke="#e74c3c" stroke-width="2"/>
  <!-- 各步骤失败线汇入总线 -->
  <line x1="550" y1="112" x2="580" y2="112" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="197" x2="580" y2="197" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="280" x2="580" y2="280" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="362" x2="580" y2="362" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="447" x2="580" y2="447" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="532" x2="580" y2="532" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 总线底部 L 形折线指向失败框顶部 -->
  <path d="M 580 565 L 580 575 L 655 575 L 655 595" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <!-- 失败框 -->
  <rect x="590" y="600" width="130" height="80" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="655" y="630" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">校验失败</text>
  <text x="655" y="652" text-anchor="middle" font-size="11" fill="#7f8c8d">停机 / 更新模式</text>
  <text x="655" y="670" text-anchor="middle" font-size="11" fill="#7f8c8d">绝不跳转不可信镜像</text>
  <!-- 左侧字段标注 -->
  <text x="25" y="112" font-size="10" fill="#e74c3c">读 crc32</text>
  <text x="25" y="197" font-size="10" fill="#e67e22">读 img_sz, hash</text>
  <text x="25" y="280" font-size="10" fill="#7f8c8d">读 PROD</text>
  <text x="25" y="362" font-size="10" fill="#2980b9">读 RCP, ROTPK1</text>
  <text x="25" y="447" font-size="10" fill="#8e44ad">读 sig, pubk</text>
  <text x="25" y="532" font-size="10" fill="#27ae60">重算 BPT 哈希</text>
</svg>
