<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- 标题 -->
  <text x="40" y="30" font-size="14" font-weight="bold" fill="#2c3e50">Flash 地址空间（APP_BASE = 0x10140000，示例值）</text>
  <!-- BPT -->
  <rect x="40" y="50" width="200" height="50" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="140" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">BPT (0x1000)</text>
  <text x="40" y="45" font-size="10" fill="#7f8c8d">+0x000</text>
  <text x="240" y="45" font-size="10" fill="#7f8c8d" text-anchor="end">+0xFFF</text>
  <!-- 镜像数据 -->
  <rect x="240" y="50" width="400" height="50" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="440" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">镜像数据（APP）</text>
  <text x="240" y="45" font-size="10" fill="#7f8c8d">+0x1000</text>
  <text x="640" y="45" font-size="10" fill="#7f8c8d" text-anchor="end">+0x1000 + img_sz</text>
  <!-- 放大指示 -->
  <line x1="140" y1="100" x2="140" y2="140" stroke="#34495e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="135,135 145,135 140,145" fill="#34495e"/>
  <text x="155" y="125" font-size="11" fill="#34495e">放大</text>
  <!-- BPT 内部标题 -->
  <text x="40" y="165" font-size="14" font-weight="bold" fill="#2c3e50">BPT 内部结构（共 0x1000 = 4096 字节）</text>
  <!-- 头部 -->
  <rect x="40" y="180" width="70" height="65" rx="3" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="75" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">头部</text>
  <text x="75" y="225" text-anchor="middle" font-size="10" fill="#7f8c8d">0x000–0x01F</text>
  <text x="75" y="242" text-anchor="middle" font-size="9" fill="#e74c3c">tag, sz</text>
  <!-- IIB -->
  <rect x="110" y="180" width="190" height="65" rx="3" fill="#fdebd0" stroke="#f39c12" stroke-width="1.5"/>
  <text x="205" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">IIB 区（8 槽 × 124B）</text>
  <text x="205" y="225" text-anchor="middle" font-size="10" fill="#7f8c8d">0x020–0x3FF</text>
  <text x="205" y="242" text-anchor="middle" font-size="9" fill="#e67e22">img_sz, hash</text>
  <!-- RCP -->
  <rect x="300" y="180" width="210" height="65" rx="3" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="405" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">RCP 区（公钥包）</text>
  <text x="405" y="225" text-anchor="middle" font-size="10" fill="#7f8c8d">0x400–0x813</text>
  <text x="405" y="242" text-anchor="middle" font-size="9" fill="#2980b9">pubk_type, pubk(n/e)</text>
  <!-- 签名区 -->
  <rect x="510" y="180" width="110" height="65" rx="3" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="565" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">签名区</text>
  <text x="565" y="225" text-anchor="middle" font-size="10" fill="#7f8c8d">0x814–0xA13</text>
  <text x="565" y="242" text-anchor="middle" font-size="9" fill="#8e44ad">sig</text>
  <!-- 尾部 -->
  <rect x="620" y="180" width="240" height="65" rx="3" fill="#eaecee" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="740" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">尾部</text>
  <text x="740" y="225" text-anchor="middle" font-size="10" fill="#7f8c8d">0xA14–0xFFF</text>
  <text x="740" y="242" text-anchor="middle" font-size="9" fill="#2c3e50">crc32, PSN, 预留</text>
  <!-- sig 覆盖范围 -->
  <line x1="40" y1="270" x2="510" y2="270" stroke="#8e44ad" stroke-width="2"/>
  <line x1="40" y1="265" x2="40" y2="275" stroke="#8e44ad" stroke-width="2"/>
  <line x1="510" y1="265" x2="510" y2="275" stroke="#8e44ad" stroke-width="2"/>
  <text x="275" y="290" text-anchor="middle" font-size="11" fill="#8e44ad" font-weight="bold">sig 覆盖：BPT[0x000–0x813]（头部 + IIB + RCP）</text>
  <!-- crc32 覆盖范围 -->
  <line x1="40" y1="310" x2="620" y2="310" stroke="#2c3e50" stroke-width="2"/>
  <line x1="40" y1="305" x2="40" y2="315" stroke="#2c3e50" stroke-width="2"/>
  <line x1="620" y1="305" x2="620" y2="315" stroke="#2c3e50" stroke-width="2"/>
  <text x="330" y="330" text-anchor="middle" font-size="11" fill="#2c3e50" font-weight="bold">crc32 覆盖：BPT[0x000–0xFEB]</text>
  <!-- 说明 -->
  <text x="40" y="370" font-size="11" fill="#7f8c8d">红色字段名为校验流程实际读取的字段；其余预留字段未标注。</text>
  <text x="40" y="390" font-size="11" fill="#7f8c8d">IIB 区共 8 个槽位，多核镜像每个核占一个槽；单镜像场景只用第一个槽。</text>
</svg>
