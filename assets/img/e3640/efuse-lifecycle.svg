<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  <rect width="850" height="380" fill="#ffffff"/>
  <!-- 开发期 -->
  <rect x="30" y="30" width="370" height="280" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="215" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">开发期</text>
  <!-- 影子寄存器 -->
  <rect x="60" y="80" width="310" height="70" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="215" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">eFuse 影子寄存器</text>
  <text x="215" y="125" text-anchor="middle" font-size="11" fill="#7f8c8d">易失 · 软件可写 · 复位即失效</text>
  <text x="215" y="142" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">不是可信根</text>
  <!-- 写伪值 -->
  <rect x="100" y="170" width="230" height="55" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="215" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">写伪值（fuse_init_for_dev）</text>
  <text x="215" y="212" text-anchor="middle" font-size="10" fill="#7f8c8d">PROD = 0x80, ROTPK1 = H_test</text>
  <line x1="215" y1="150" x2="215" y2="170" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr4)"/>
  <!-- 结果 -->
  <text x="215" y="255" text-anchor="middle" font-size="12" fill="#2c3e50">校验流程跑通（基于伪值）</text>
  <text x="215" y="278" text-anchor="middle" font-size="11" fill="#e74c3c">量产版本必须删除此初始化代码</text>
  <!-- 量产期 -->
  <rect x="450" y="30" width="370" height="280" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="635" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">量产期</text>
  <!-- OTP 单元 -->
  <rect x="480" y="80" width="310" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="635" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">eFuse OTP 单元</text>
  <text x="635" y="125" text-anchor="middle" font-size="11" fill="#7f8c8d">非易失 · 一次性烧写 · 物理固化</text>
  <text x="635" y="142" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">真可信根</text>
  <!-- 烧写真值 -->
  <rect x="520" y="170" width="230" height="55" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="635" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">量产烧写真值</text>
  <text x="635" y="212" text-anchor="middle" font-size="10" fill="#7f8c8d">真实 ROTPK1 哈希 + PROD 标志</text>
  <line x1="635" y1="150" x2="635" y2="170" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr4)"/>
  <!-- 结果 -->
  <text x="635" y="255" text-anchor="middle" font-size="12" fill="#2c3e50">校验读取真实熔丝值</text>
  <text x="635" y="278" text-anchor="middle" font-size="11" fill="#27ae60">伪熔丝初始化函数已删除</text>
  <!-- 中间分隔 -->
  <line x1="425" y1="50" x2="425" y2="290" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="425" y="335" text-anchor="middle" font-size="11" fill="#7f8c8d">分水岭：易失 vs 非易失 · 可写 vs 一次性</text>
</svg>
