<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" width="1120" height="650" font-family="Consolas, SimHei, sans-serif">
  <defs>
    <marker id="arr-ov" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="1120" height="650" fill="#ffffff"/>
  <text x="560" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">中央计算平台部署总览：大脑与小脑</text>
  <text x="560" y="52" text-anchor="middle" font-size="10.5" fill="#777777">舱驾融合计算（大脑）+ 整车控制平台（小脑）· PCIe 直连 + TSN 以太网互联</text>

  <!-- Brain platform -->
  <rect x="40" y="76" width="400" height="280" rx="6" fill="#f7f7f7"/>
  <rect x="56" y="88" width="190" height="24" fill="#1a73e8"/>
  <text x="151" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">大脑 · 舱驾融合计算</text>
  <rect x="60" y="126" width="360" height="28" fill="#d9d9d9"/>
  <text x="240" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Type-1 Hypervisor</text>
  <rect x="60" y="168" width="360" height="40" fill="#d9d9d9"/>
  <text x="240" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">座舱 VM</text>
  <text x="240" y="201" text-anchor="middle" font-size="9" fill="#555555">HMI · 应用 · 语音 · 大模型</text>
  <rect x="60" y="216" width="360" height="40" fill="#d9d9d9"/>
  <text x="240" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">安全 VM</text>
  <text x="240" y="249" text-anchor="middle" font-size="9" fill="#555555">仪表 · 车控 · 安全网关</text>
  <rect x="60" y="264" width="360" height="40" fill="#d9d9d9"/>
  <text x="240" y="282" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">智驾 VM</text>
  <text x="240" y="297" text-anchor="middle" font-size="9" fill="#555555">感知 · 融合 · 规划</text>
  <text x="240" y="334" text-anchor="middle" font-size="9.5" fill="#888888">GPU · ISP · 大算力 NPU · 消费电子换代节奏</text>

  <!-- Cerebellum platform -->
  <rect x="520" y="76" width="560" height="500" rx="6" fill="#f7f7f7"/>
  <rect x="536" y="88" width="200" height="24" fill="#e8710a"/>
  <text x="636" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">小脑 · 整车控制平台</text>

  <!-- A side: 2 service cohorts -->
  <rect x="536" y="122" width="528" height="180" fill="none" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="548" y="141" font-size="11" font-weight="bold" fill="#1a73e8">A 侧 · 车辆服务与边缘计算（裸机 Linux，2 Cohort）</text>
  <rect x="552" y="150" width="240" height="76" fill="#d9d9d9"/>
  <text x="672" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">Cohort 5 · 整车服务与数据平台</text>
  <text x="672" y="184" text-anchor="middle" font-size="8.5" fill="#555555">Yocto Linux · 4× A78AE</text>
  <text x="672" y="199" text-anchor="middle" font-size="8.5" fill="#555555">OTA 编排 · 数据中台 · SOA / TSP</text>
  <text x="672" y="214" text-anchor="middle" font-size="8.5" fill="#555555">远程诊断</text>
  <rect x="808" y="150" width="240" height="76" fill="#d9d9d9"/>
  <text x="928" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">Cohort 6 · 智能应用与边缘计算</text>
  <text x="928" y="184" text-anchor="middle" font-size="8.5" fill="#555555">Yocto Linux + NPU · 4× A78AE</text>
  <text x="928" y="199" text-anchor="middle" font-size="8.5" fill="#555555">预测性维护 · 边缘 AI · ADAS 后处理</text>
  <text x="928" y="214" text-anchor="middle" font-size="8.5" fill="#555555">安全审计 · 数据闭环</text>
  <rect x="552" y="234" width="496" height="24" fill="#cfcfcf"/>
  <text x="800" y="250" text-anchor="middle" font-size="9.5" fill="#333333">8× Cortex-A78AE · 2 Cohort × 2 Cluster（Split）</text>
  <text x="548" y="288" font-size="8.5" fill="#888888">注：A 侧服务不碰执行器——车控请求经小脑的安全校验后执行</text>

  <!-- R side: 3 RTU cohorts -->
  <rect x="536" y="302" width="528" height="174" fill="none" stroke="#d93025" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="548" y="321" font-size="11" font-weight="bold" fill="#d93025">R 侧 · 硬实时控制 — ASIL D 独占 RTU，AUTOSAR CP 裸机</text>
  <g>
    <rect x="548" y="332" width="160" height="104" fill="#e9e9e9" stroke="#bbbbbb" stroke-width="1"/>
    <text x="628" y="348" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333333">RTU 0 · 动力总成</text>
    <rect x="556" y="354" width="144" height="16" fill="#c9c9c9"/>
    <text x="628" y="366" text-anchor="middle" font-size="8" fill="#444444">Cohort 1 · ASIL D · 全锁步</text>
    <rect x="556" y="374" width="144" height="26" fill="#d9d9d9"/>
    <text x="628" y="387" text-anchor="middle" font-size="8.5" fill="#333333">电机控制 · BMS</text>
    <text x="628" y="397" text-anchor="middle" font-size="8" fill="#777777">OBC / DC-DC</text>
    <rect x="556" y="404" width="144" height="26" fill="#d9d9d9"/>
    <text x="628" y="417" text-anchor="middle" font-size="8.5" fill="#333333">4× R52（2 Cluster）</text>
    <text x="628" y="427" text-anchor="middle" font-size="8" fill="#777777">10 MB SRAM</text>
  </g>
  <g>
    <rect x="720" y="332" width="160" height="104" fill="#e9e9e9" stroke="#bbbbbb" stroke-width="1"/>
    <text x="800" y="348" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333333">RTU 1 · 底盘+监控</text>
    <rect x="728" y="354" width="144" height="16" fill="#c9c9c9"/>
    <text x="800" y="366" text-anchor="middle" font-size="8" fill="#444444">Cohort 2 · ASIL D · 全锁步</text>
    <rect x="728" y="374" width="144" height="26" fill="#d9d9d9"/>
    <text x="800" y="387" text-anchor="middle" font-size="8.5" fill="#333333">Cluster 0 · 底盘控制</text>
    <text x="800" y="397" text-anchor="middle" font-size="8" fill="#777777">EPS / ESC / 制动 / 悬架</text>
    <rect x="728" y="404" width="144" height="26" fill="#d9d9d9"/>
    <text x="800" y="417" text-anchor="middle" font-size="8.5" fill="#333333">Cluster 1 · ADAS 安全监控</text>
    <text x="800" y="427" text-anchor="middle" font-size="8" fill="#777777">意图校验 · MRM</text>
  </g>
  <g>
    <rect x="892" y="332" width="160" height="104" fill="#e9e9e9" stroke="#bbbbbb" stroke-width="1"/>
    <text x="972" y="348" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333333">RTU 2 · 车身+网关</text>
    <rect x="900" y="354" width="144" height="16" fill="#c9c9c9"/>
    <text x="972" y="366" text-anchor="middle" font-size="8" fill="#444444">Cohort 3 / 4 · ASIL B · Split</text>
    <rect x="900" y="374" width="144" height="26" fill="#d9d9d9"/>
    <text x="972" y="387" text-anchor="middle" font-size="8.5" fill="#333333">Cluster 0 · 车身与舒适</text>
    <text x="972" y="397" text-anchor="middle" font-size="8" fill="#777777">BCM · 热管理 · 泊车辅助</text>
    <rect x="900" y="404" width="144" height="26" fill="#d9d9d9"/>
    <text x="972" y="417" text-anchor="middle" font-size="8.5" fill="#333333">Cluster 1 · 中央网关</text>
    <text x="972" y="427" text-anchor="middle" font-size="8" fill="#777777">路由 / IDPS + RCU 卸载</text>
  </g>
  <rect x="548" y="444" width="496" height="22" fill="#cfcfcf"/>
  <text x="796" y="459" text-anchor="middle" font-size="9.5" fill="#333333">12× Cortex-R52 · 3 RTU · AUTOSAR CP 裸机 · 1:1 核映射</text>

  <!-- Foundation bars -->
  <rect x="536" y="488" width="528" height="26" fill="#d9d9d9"/>
  <text x="800" y="505" text-anchor="middle" font-size="9.5" fill="#333333">Services — 共享内存 · 硬件资源域隔离（XRDC）</text>
  <rect x="536" y="520" width="528" height="26" fill="#cfcfcf"/>
  <text x="800" y="537" text-anchor="middle" font-size="9.5" fill="#333333">Infrastructure — M7 管家岛（Cohort 0）· HSE2 · Boot-to-Safety</text>

  <!-- interconnect -->
  <line x1="440" y1="216" x2="512" y2="216" stroke="#666666" stroke-width="1.5" marker-end="url(#arr-ov)"/>
  <line x1="520" y1="232" x2="448" y2="232" stroke="#666666" stroke-width="1.5" marker-end="url(#arr-ov)"/>
  <text x="480" y="204" text-anchor="middle" font-size="9" fill="#666666">PCIe Gen4</text>
  <line x1="440" y1="252" x2="512" y2="252" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-ov)"/>
  <line x1="520" y1="268" x2="448" y2="268" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-ov)"/>
  <text x="480" y="290" text-anchor="middle" font-size="9" fill="#666666">TSN 以太网</text>

  <text x="560" y="616" text-anchor="middle" font-size="10" fill="#999999">大脑管体验与生态，小脑管安全与确定——各按自己的节奏演进，经 TSN / PCIe 协同</text>
</svg>
