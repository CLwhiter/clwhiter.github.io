<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Consolas, SimHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glowChip" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="chipStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#64748b" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- glow behind chip -->
  <ellipse cx="955" cy="395" rx="270" ry="190" fill="url(#glowChip)"/>

  <!-- title block -->
  <text x="600" y="100" text-anchor="middle" font-size="12" fill="#475569" letter-spacing="5">SOFTWARE DEPLOYMENT EVOLUTION</text>
  <text x="600" y="165" text-anchor="middle" font-family="SimHei, sans-serif" font-size="46" font-weight="bold" fill="#f1f5f9">从独立域控到中央计算</text>
  <text x="600" y="214" text-anchor="middle" font-size="20" fill="#94a3b8" letter-spacing="8">软件部署演进</text>
  <rect x="540" y="236" width="120" height="2" fill="url(#divider)"/>

  <!-- scattered nodes : distributed era -->
  <g>
    <rect x="82"  y="308" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.45"/>
    <rect x="138" y="296" width="20" height="20" rx="3" fill="#94a3b8" opacity="0.30"/>
    <rect x="203" y="312" width="14" height="14" rx="3" fill="#f59e0b" opacity="0.45"/>
    <rect x="272" y="300" width="18" height="18" rx="3" fill="#38bdf8" opacity="0.30"/>
    <rect x="92"  y="364" width="20" height="20" rx="3" fill="#f59e0b" opacity="0.35"/>
    <rect x="158" y="354" width="14" height="14" rx="3" fill="#38bdf8" opacity="0.60"/>
    <rect x="228" y="348" width="18" height="18" rx="3" fill="#94a3b8" opacity="0.40"/>
    <rect x="292" y="362" width="14" height="14" rx="3" fill="#38bdf8" opacity="0.50"/>
    <rect x="118" y="420" width="16" height="16" rx="3" fill="#94a3b8" opacity="0.35"/>
    <rect x="184" y="428" width="20" height="20" rx="3" fill="#38bdf8" opacity="0.45"/>
    <rect x="252" y="416" width="14" height="14" rx="3" fill="#f59e0b" opacity="0.40"/>
    <rect x="298" y="450" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.30"/>
    <rect x="68"  y="436" width="14" height="14" rx="3" fill="#38bdf8" opacity="0.30"/>
  </g>
  <g stroke="#334155" stroke-width="1" opacity="0.55">
    <line x1="98"  y1="316" x2="150" y2="306"/>
    <line x1="158" y1="306" x2="210" y2="319"/>
    <line x1="237" y1="326" x2="279" y2="309"/>
    <line x1="102" y1="374" x2="165" y2="368"/>
    <line x1="237" y1="357" x2="299" y2="369"/>
    <line x1="126" y1="428" x2="191" y2="438"/>
    <line x1="259" y1="423" x2="305" y2="458"/>
    <line x1="82"  y1="443" x2="125" y2="428"/>
  </g>

  <!-- convergence wires -->
  <g fill="none" stroke-linecap="round">
    <path d="M 320 330 C 480 330, 620 345, 856 366" stroke="url(#wire)" stroke-width="2.2"/>
    <path d="M 320 360 C 480 355, 620 360, 856 382" stroke="url(#wire)" stroke-width="2.6" filter="url(#glow)"/>
    <path d="M 320 395 C 480 390, 620 380, 856 398" stroke="url(#wire)" stroke-width="2.6" filter="url(#glow)"/>
    <path d="M 320 430 C 480 420, 620 400, 856 414" stroke="url(#wire)" stroke-width="2.2"/>
  </g>
  <circle cx="320" cy="330" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="320" cy="360" r="3" fill="#818cf8" opacity="0.7"/>
  <circle cx="320" cy="395" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="320" cy="430" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="520" cy="349" r="3.5" fill="#38bdf8" opacity="0.55"/>
  <circle cx="520" cy="390" r="3.5" fill="#818cf8" opacity="0.55"/>
  <circle cx="660" cy="364" r="4" fill="#38bdf8" opacity="0.65"/>

  <!-- central chip -->
  <g>
    <rect x="858" y="338" width="10" height="10" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="858" y="374" width="10" height="10" rx="2" fill="#818cf8" opacity="0.8"/>
    <rect x="858" y="410" width="10" height="10" rx="2" fill="#f59e0b" opacity="0.8"/>
    <rect x="880" y="320" width="150" height="150" rx="14" fill="#38bdf8" fill-opacity="0.06" stroke="url(#chipStroke)" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="906" y="346" width="44" height="44" rx="6" fill="#38bdf8" opacity="0.28" stroke="#7dd3fc" stroke-width="1"/>
    <rect x="960" y="346" width="44" height="44" rx="6" fill="#818cf8" opacity="0.28" stroke="#a5b4fc" stroke-width="1"/>
    <rect x="906" y="400" width="44" height="44" rx="6" fill="#818cf8" opacity="0.28" stroke="#a5b4fc" stroke-width="1"/>
    <rect x="960" y="400" width="44" height="44" rx="6" fill="#f59e0b" opacity="0.24" stroke="#fbbf24" stroke-width="1"/>
    <rect x="1040" y="338" width="10" height="10" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="1040" y="374" width="10" height="10" rx="2" fill="#818cf8" opacity="0.8"/>
    <rect x="1040" y="410" width="10" height="10" rx="2" fill="#f59e0b" opacity="0.8"/>
    <rect x="918" y="480" width="10" height="10" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="948" y="480" width="10" height="10" rx="2" fill="#818cf8" opacity="0.7"/>
    <rect x="978" y="480" width="10" height="10" rx="2" fill="#f59e0b" opacity="0.7"/>
  </g>

  <!-- bottom tagline -->
  <rect x="480" y="548" width="240" height="1.5" fill="#334155"/>
  <text x="600" y="582" text-anchor="middle" font-size="13" fill="#475569">EEA · Hypervisor · RTOS · 大脑与小脑</text>
</svg>
