<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Consolas, SimHei, sans-serif">
  <defs>
    <linearGradient id="socGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
    <linearGradient id="hvGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5"/>
      <stop offset="100%" style="stop-color:#d1fae5"/>
    </linearGradient>
    <linearGradient id="mcuGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
    <filter id="shadow2" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#fafafa"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">阶段二：舱驾一体控制器——One Chip Hypervisor + 外置 MCU</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#64748b">应用层虚拟化，实时层仍物理分离 · 代表：高通 8775 / 英伟达 Thor</text>

  <!-- SoC with Hypervisor -->
  <rect x="40" y="75" width="540" height="380" rx="8" fill="url(#socGrad2)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="40" y="75" width="540" height="30" rx="8" fill="#3b82f6"/>
  <rect x="40" y="97" width="540" height="8" fill="#3b82f6"/>
  <text x="310" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">舱驾一体 SoC（One Chip）</text>

  <!-- Guest OS row -->
  <!-- Android -->
  <rect x="60" y="120" width="155" height="160" rx="6" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="60" y="120" width="155" height="26" rx="6" fill="#dbeafe"/>
  <rect x="60" y="140" width="155" height="6" fill="#dbeafe"/>
  <text x="137" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Android VM</text>
  <text x="137" y="162" text-anchor="middle" font-size="10" fill="#475569">座舱娱乐 / 交互</text>
  <text x="137" y="180" text-anchor="middle" font-size="10" fill="#475569">导航 · 音乐 · 语音</text>
  <text x="137" y="198" text-anchor="middle" font-size="10" fill="#475569">应用商店 · CarPlay</text>
  <line x1="75" y1="210" x2="200" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <text x="137" y="228" text-anchor="middle" font-size="9" fill="#94a3b8">QM · 非实时</text>
  <text x="137" y="246" text-anchor="middle" font-size="9" fill="#94a3b8">约 4 核 · 6GB 内存</text>
  <text x="137" y="264" text-anchor="middle" font-size="9" fill="#94a3b8">VIRTIO 驱动</text>

  <!-- QNX -->
  <rect x="230" y="120" width="155" height="160" rx="6" fill="#fff" stroke="#34d399" stroke-width="2"/>
  <rect x="230" y="120" width="155" height="26" rx="6" fill="#d1fae5"/>
  <rect x="230" y="140" width="155" height="6" fill="#d1fae5"/>
  <text x="307" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">QNX VM</text>
  <text x="307" y="162" text-anchor="middle" font-size="10" fill="#475569">仪表渲染 · 车控</text>
  <text x="307" y="180" text-anchor="middle" font-size="10" fill="#475569">安全网关</text>
  <text x="307" y="198" text-anchor="middle" font-size="10" fill="#475569">OTA 安全校验</text>
  <line x1="245" y1="210" x2="370" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <text x="307" y="228" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">ASIL-D · 硬实时 &lt;1ms</text>
  <text x="307" y="246" text-anchor="middle" font-size="9" fill="#94a3b8">绑安全核 · 2GB 内存</text>
  <text x="307" y="264" text-anchor="middle" font-size="9" fill="#94a3b8">原生驱动 · I/O 直通</text>

  <!-- Linux -->
  <rect x="400" y="120" width="160" height="160" rx="6" fill="#fff" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="400" y="120" width="160" height="26" rx="6" fill="#fef3c7"/>
  <rect x="400" y="140" width="160" height="6" fill="#fef3c7"/>
  <text x="480" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Linux VM</text>
  <text x="480" y="162" text-anchor="middle" font-size="10" fill="#475569">智驾感知 / 规划</text>
  <text x="480" y="180" text-anchor="middle" font-size="10" fill="#475569">摄像头 ISP</text>
  <text x="480" y="198" text-anchor="middle" font-size="10" fill="#475569">BEV · 路径规划</text>
  <line x1="415" y1="210" x2="545" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="228" text-anchor="middle" font-size="9" fill="#92400e">ASIL-B（可选）· 软实时</text>
  <text x="480" y="246" text-anchor="middle" font-size="9" fill="#94a3b8">约 4 核 · 4GB 内存</text>
  <text x="480" y="264" text-anchor="middle" font-size="9" fill="#94a3b8">NPU/GPU 加速</text>

  <!-- Hypervisor bar -->
  <rect x="60" y="295" width="500" height="32" rx="4" fill="url(#hvGrad2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="310" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">Type-1 Hypervisor（QNX Hypervisor / Multivisor / Xen / ACRN）</text>

  <!-- Hypervisor features -->
  <text x="80" y="350" font-size="10" fill="#475569">• vCPU 绑核：QNX 绑安全核，Android 绑性能核</text>
  <text x="80" y="368" font-size="10" fill="#475569">• 内存配额硬隔离：各 VM 内存上限固定，防 OOM 互影响</text>
  <text x="80" y="386" font-size="10" fill="#475569">• I/O 直通或虚拟化：安全关键外设直通 QNX</text>
  <text x="80" y="404" font-size="10" fill="#475569">• Watchdog：Hypervisor 监控各 VM 心跳，超时强制重启</text>
  <text x="80" y="422" font-size="10" fill="#475569">• 共享内存：座舱↔智驾零拷贝数据通道（传感器数据、规划结果）</text>

  <!-- R5 safety island -->
  <rect x="350" y="435" width="210" height="20" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="455" y="449" text-anchor="middle" font-size="9" fill="#991b1b">R5 安全岛：芯片级安全监控（不承担整车车控）</text>

  <!-- External MCU -->
  <rect x="610" y="75" width="260" height="380" rx="8" fill="url(#mcuGrad2)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="610" y="75" width="260" height="30" rx="8" fill="#f59e0b"/>
  <rect x="610" y="97" width="260" height="8" fill="#f59e0b"/>
  <text x="740" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">外置独立 MCU</text>

  <rect x="630" y="120" width="220" height="36" rx="4" fill="#fff" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="740" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Cortex-M/R（S32G / TC3xx）</text>

  <rect x="630" y="170" width="220" height="120" rx="4" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="740" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">AUTOSAR CP（完整）</text>
  <text x="740" y="212" text-anchor="middle" font-size="10" fill="#475569">整车 CAN 网关</text>
  <text x="740" y="230" text-anchor="middle" font-size="10" fill="#475569">底层执行闭环</text>
  <text x="740" y="248" text-anchor="middle" font-size="10" fill="#475569">E2E 保护</text>
  <text x="740" y="266" text-anchor="middle" font-size="10" fill="#475569">休眠唤醒管理</text>
  <text x="740" y="284" text-anchor="middle" font-size="9" fill="#94a3b8">硬实时 · ASIL-D</text>

  <rect x="630" y="305" width="220" height="60" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="740" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">SoC 健康监控</text>
  <text x="740" y="343" text-anchor="middle" font-size="9" fill="#475569">SoC 异常时独立触发</text>
  <text x="740" y="358" text-anchor="middle" font-size="9" fill="#475569">安全降级（不依赖 SoC）</text>

  <!-- Link SoC <-> MCU -->
  <line x1="580" y1="260" x2="610" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="610" y1="260" x2="580" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="595" y="248" text-anchor="middle" font-size="9" fill="#64748b">以太网/CAN</text>
  <text x="595" y="280" text-anchor="middle" font-size="9" fill="#94a3b8">毫秒级</text>

  <!-- CAN bus -->
  <line x1="740" y1="380" x2="740" y2="410" stroke="#f59e0b" stroke-width="2"/>
  <rect x="650" y="410" width="180" height="28" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="740" y="428" text-anchor="middle" font-size="11" fill="#92400e">整车 CAN / LIN 总线</text>

  <!-- Bottom note -->
  <rect x="40" y="470" width="830" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="455" y="492" text-anchor="middle" font-size="10" fill="#475569">关键特征：应用层全面虚拟化（3 Guest OS），实时层仍物理分离（外置 MCU）。跨域延迟：片内微秒级（座舱↔智驾），片间毫秒级（SoC↔MCU）。</text>
</svg>
