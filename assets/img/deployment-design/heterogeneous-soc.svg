<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Consolas, SimHei, sans-serif">
  <defs>
    <linearGradient id="hetGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <filter id="shadowh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">异构单芯片：Linux + RTOS 同芯（RK3588 big.LITTLE）</text>
  <text x="350" y="52" text-anchor="middle" font-size="11" fill="#64748b">A76 跑应用 · A55 跑 RTOS · 用核的异构性代替物理分离 · 目前用于简单机器人</text>

  <!-- SoC -->
  <rect x="70" y="75" width="560" height="250" rx="8" fill="url(#hetGrad2)" stroke="#22c55e" stroke-width="2" filter="url(#shadowh)"/>
  <rect x="70" y="75" width="560" height="30" rx="8" fill="#22c55e"/>
  <rect x="70" y="97" width="560" height="8" fill="#22c55e"/>
  <text x="350" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">RK3588（4×A76 + 4×A55 big.LITTLE）</text>

  <!-- A76 cores -->
  <rect x="90" y="120" width="240" height="180" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="90" y="120" width="240" height="26" rx="6" fill="#dbeafe"/>
  <rect x="90" y="140" width="240" height="6" fill="#dbeafe"/>
  <text x="210" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Cortex-A76 ×4（大核 · 2.4GHz）</text>

  <rect x="110" y="160" width="200" height="55" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="210" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Linux</text>
  <text x="210" y="200" text-anchor="middle" font-size="10" fill="#475569">视觉 SLAM · AI 识别 · ROS 2</text>

  <text x="210" y="238" text-anchor="middle" font-size="10" fill="#3b82f6">高吞吐量 · 非实时</text>
  <text x="210" y="256" text-anchor="middle" font-size="9" fill="#64748b">MMU · 大缓存 · 乱序执行</text>
  <text x="210" y="274" text-anchor="middle" font-size="9" fill="#64748b">能跑复杂 OS 和 AI 框架</text>
  <text x="210" y="292" text-anchor="middle" font-size="9" fill="#94a3b8">无功能安全认证</text>

  <!-- Shared memory bridge -->
  <line x1="330" y1="210" x2="370" y2="210" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="330" y="185" width="40" height="50" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="350" y="205" text-anchor="middle" font-size="8" fill="#5b21b6">共享</text>
  <text x="350" y="218" text-anchor="middle" font-size="8" fill="#5b21b6">内存</text>
  <text x="350" y="255" text-anchor="middle" font-size="9" fill="#7c3aed">rpmsg</text>
  <text x="350" y="270" text-anchor="middle" font-size="9" fill="#7c3aed">μs级</text>

  <!-- A55 cores -->
  <rect x="370" y="120" width="240" height="180" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="370" y="120" width="240" height="26" rx="6" fill="#fef3c7"/>
  <rect x="370" y="140" width="240" height="6" fill="#fef3c7"/>
  <text x="490" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Cortex-A55 ×4（小核 · 1.8GHz）</text>

  <rect x="390" y="160" width="200" height="55" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="490" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">RTOS（软实时）</text>
  <text x="490" y="200" text-anchor="middle" font-size="10" fill="#475569">运动控制 · EtherCAT 主站</text>

  <text x="490" y="238" text-anchor="middle" font-size="10" fill="#f59e0b">软实时 · 毫秒级周期</text>
  <text x="490" y="256" text-anchor="middle" font-size="9" fill="#64748b">能效核 · 有缓存和 MMU</text>
  <text x="490" y="274" text-anchor="middle" font-size="9" fill="#64748b">无 TCM · WCET 分析精度有限</text>
  <text x="490" y="292" text-anchor="middle" font-size="9" fill="#ef4444">非硬实时 · 无功能安全</text>

  <!-- M core note -->
  <rect x="90" y="310" width="520" height="20" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="350" y="324" text-anchor="middle" font-size="9" fill="#64748b">注：部分方案中 M 核（M0/M7 级）负责低功耗管理和传感器 hub，实时控制主力是 A55，不是 M 核</text>

  <!-- External bus -->
  <line x1="490" y1="325" x2="490" y2="350" stroke="#f59e0b" stroke-width="2"/>
  <rect x="390" y="350" width="200" height="28" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="490" y="368" text-anchor="middle" font-size="11" fill="#92400e">EtherCAT / CAN（关节/执行器）</text>

  <!-- Bottom limitation -->
  <rect x="70" y="345" width="240" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="190" y="365" text-anchor="middle" font-size="10" fill="#991b1b">局限：A55 非硬实时核</text>
  <text x="190" y="380" text-anchor="middle" font-size="9" fill="#78716c">仅适用于简单机器人，撑不起汽车级控制</text>
</svg>
